# Re-resolve the service name when Docker replaces the backend container.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_api {
    zone backend_api 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # The trailing slash removes /api/ before forwarding to FastAPI.
        proxy_pass http://backend_api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backtests wait for both a price download and synchronous execution.
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
