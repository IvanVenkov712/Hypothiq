services:
  backend:
    build: ./backend
    environment:
      # Trust Nginx's forwarded headers; the API has no published host port.
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped
